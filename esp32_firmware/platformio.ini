; =====================================================================
;  VE-con ESP32-C3 足回りファームウェア（PlatformIO）
;  VS Code の PlatformIO 拡張で、このフォルダ（esp32_firmware）を開いて
;  左下の「→（Upload）」で書き込み、「コンセント（Monitor）」でシリアル表示。
; =====================================================================
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    ; ESP32-C3 内蔵 USB を Serial として使う（ラズパイからは /dev/ttyACM0 に見える）
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
    adafruit/Adafruit BNO055@^1.6.3
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
