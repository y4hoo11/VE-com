# =====================================================================
#  PC1 で、ラズパイとつなぐときに足すファイル（main ブランチの docker-compose.yml に重ねて使う）
#
#    docker compose -f docker-compose.yml -f edge_ai/docker/docker-compose.pc1-zenoh.yml up -d
#
#  なぜ Zenoh？
#    ROS 2 の通信（DDS）はマルチキャストで相手を探すが、Windows の Docker Desktop の中からは
#    外（ラズパイ）にマルチキャストが届かない。Zenoh ブリッジは TCP 1本（7447番）でつなぐので確実。
#    コンテナの中は今まで通り ROS_LOCALHOST_ONLY=1 のままでよい。
# =====================================================================
services:
  ros2_dev:
    cap_add:
      - NET_ADMIN       # run_pc1.sh / run_sim.sh が localhost のマルチキャストを有効にするため
    ports:
      - "7447:7447"     # ラズパイの Zenoh ブリッジがここへつなぎに来る
      - "5000:5000"     # marker_localizer のマーカー解析つき映像 http://<PC1>:5000/video

  zenoh:
    image: eclipse/zenoh-bridge-ros2dds:1.10.1
    container_name: ve_con_zenoh
    restart: unless-stopped
    network_mode: "service:ros2_dev"   # ros2_dev と同じネットワーク（localhost を共有）
    depends_on:
      - ros2_dev
    environment:
      - ROS_DOMAIN_ID=30
      - ROS_LOCALHOST_ONLY=1
      - ROS_DISTRO=humble
      - RUST_LOG=info
    command: ["-l", "tcp/0.0.0.0:7447"]
