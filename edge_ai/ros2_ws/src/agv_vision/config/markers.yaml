# =====================================================================
#  ArUco マーカーの設置場所（Nav2 の map 座標）
#  - 印刷: ros2 run agv_vision make_markers --ids 0 1 2 3 --size-mm 150
#  - mount: wall  … 壁に貼る。facing_deg = マーカーの表が向いている方向（部屋の内側）
#                   z = マーカー中心の床からの高さ [m]
#  - mount: floor … 床に貼る。rotation_deg = マーカーの「上辺」が向いている方向
#  ※ demo_map 用のサンプルです。実際に貼った位置を測って書き換えてください。
# =====================================================================
markers:
  - id: 0
    mount: wall
    x: -2.25          # 中央ブロックの下側の面
    y: 1.0
    z: 0.15
    facing_deg: -90   # 下（-y方向）を向いている

  - id: 1
    mount: wall
    x: 1.0            # 右の部屋の左側の外壁
    y: 0.5
    z: 0.15
    facing_deg: 180   # 左（-x方向）を向いている

  - id: 2
    mount: wall
    x: 0.0            # 一番下の外壁
    y: -4.85
    z: 0.15
    facing_deg: 90    # 上（+y方向）を向いている

  - id: 3
    mount: wall
    x: -4.85          # 一番左の外壁
    y: -2.0
    z: 0.15
    facing_deg: 0     # 右（+x方向）を向いている
