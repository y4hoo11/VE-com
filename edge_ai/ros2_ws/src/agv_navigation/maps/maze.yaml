image: maze.pgm
mode: trinary
resolution: 0.15       # 1ピクセルあたり0.15メートル（15cm）
origin: [-1.500, -1.500, 0.0] # 原点（地図の左下端が世界のどの座標か）
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
# 迷路: 16x10 マス(基準 1m ピッチ) 通路幅 基準 0.9m seed=2026 ループ 8 本 行き止まり 16 箇所 スタート→ゴール最短 56 マス(約 168 m)
# 実寸の倍率: 基準の 3 倍
# サイズ: 320x200px = 48m x 30m
# スタート位置(x, y)[m]: [0.00, 0.00]   # 原点に合わせてある
# ゴール位置(x, y)[m]: [45.00, 27.00]
