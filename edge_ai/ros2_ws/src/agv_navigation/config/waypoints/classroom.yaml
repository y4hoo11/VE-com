# =====================================================================
#  地点（ウェイポイント）一覧  ※座標は maps/classroom.yaml（= Nav2 の map 座標） [m]
#  部屋（横 10.0m x 縦 23.0m。実寸 5.0m x 11.5m の2倍）の後ろ・左の角が (0, 0)。x = 右、y = 前（スクリーン側）
#  【仮】地図の通れる場所から仮に置いた位置。実際に使う前に測り直してください
#  （ros2 run agv_navigation check_waypoints --map maps/classroom.yaml で確認できます）
#  座標は実寸のときの位置を2倍にしたもの（地図を2倍にしたため）
# =====================================================================
waypoints:
  - name: "Home"            # 後ろの真ん中
    x: 4.60
    y: 2.00
    theta_deg: 90
    charger: true
    aliases: ["home", "充電ステーション"]

  - name: "Dock-A"          # 右の後ろの広い所
    x: 6.40
    y: 6.40
    theta_deg: 90
    aliases: ["DockA", "入荷口A"]

  - name: "Dock-B"          # 後ろの右（作業机の手前）
    x: 7.20
    y: 2.00
    theta_deg: 90
    aliases: ["DockB", "入荷口B"]

  - name: "A13"             # 中央の通路のまん中
    x: 4.84
    y: 13.60
    theta_deg: 90
    aliases: ["棚A13"]

  - name: "Station-1"       # 中央の通路の前の方
    x: 4.84
    y: 18.00
    theta_deg: 90
    aliases: ["Station1", "1", "部屋"]

  - name: "Station-2"       # 右の列のいちばん後ろの机の手前
    x: 7.40
    y: 8.60
    theta_deg: 90
    aliases: ["Station2", "2"]

  - name: "Station-3"       # 後ろの左
    x: 2.00
    y: 2.00
    theta_deg: 180
    aliases: ["Station3", "3"]
