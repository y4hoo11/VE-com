image: maze.pgm
mode: trinary
resolution: 0.05       # 1ピクセルあたり0.05メートル（5cm）
origin: [-5.0, -5.0, 0.0] # 原点（地図の左下端が世界のどの座標か）
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
# 迷路: 16x10 マス(1m ピッチ) 通路幅 0.9m seed=2026 ループ 8 本 行き止まり 16 箇所 スタート→ゴール最短 56 マス(約 56 m)
# サイズ: 320x200px = 16m x 10m
# スタート位置(x, y)[m]: [-4.50, -4.50]
# ゴール位置(x, y)[m]: [10.50, 4.50]
